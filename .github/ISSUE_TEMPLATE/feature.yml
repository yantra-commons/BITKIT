name: Feature request
description: Suggest an improvement to an existing component, adapter or the core.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch welcome (attributes, events, slots).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
