name: Component request
description: Propose a new component.
labels: [component-request]
body:
  - type: input
    id: name
    attributes:
      label: Proposed tag
      placeholder: ou-psbt-summary
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Which apps need this, and how do they build it today?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design references
      description: Links to the Bitcoin Design Guide, existing wallets or mockups.
  - type: textarea
    id: api
    attributes:
      label: API sketch
      description: Attributes, properties, events, slots, parts.
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does it touch keys, seeds, credentials or payments?
