version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
      scure-noble:
        patterns: ['@scure/*', '@noble/*']
      lit:
        patterns: ['lit', '@lit/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
