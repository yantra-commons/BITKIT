version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; lift once it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types track the minimum supported runtime (Node 22, see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development
      scure-noble:
        patterns: ['@scure/*', '@noble/*']
      lit:
        patterns: ['lit', '@lit/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
